<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ernas Meisterprüfung – Martinslegende</title><style>
:root{--gold:#ffd48a;--ink:#25314a;--purple:#51416e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#5b537e,transparent 42%),linear-gradient(145deg,#1b2946,#27375b 70%,#16243d);font-family:system-ui,Arial,sans-serif;color:var(--ink);min-height:100vh}.wrap{max-width:880px;margin:auto;padding:20px 15px 50px}.hero{text-align:center;color:white;padding:12px 0}.hero .art{font-size:54px}.hero h1{font-family:Georgia,serif;color:var(--gold);font-size:clamp(29px,5vw,46px);margin:6px 0}.hero p{line-height:1.5}.card{background:#fff9ed;border:4px solid #e9d5a5;border-radius:26px;padding:clamp(19px,4vw,34px);box-shadow:0 15px 38px #10172988}.pill{display:inline-block;background:#e8ddfa;color:#43345e;border-radius:30px;padding:7px 13px;font-weight:750}.progress{height:13px;border-radius:10px;background:#e5e0d8;margin:18px 0;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#a780ce,#f0b85f);transition:width .25s}.story{background:#f1eaf9;border-left:5px solid #8262ac;border-radius:12px;padding:16px 18px;line-height:1.75;font-size:18px;margin:20px 0}.question{font-size:22px;font-weight:800;line-height:1.4}.choices{display:grid;gap:12px;margin:18px 0}.choice{background:white;border:2px solid #d6c8af;border-radius:15px;padding:14px 16px;text-align:left;font:inherit;font-size:17px;cursor:pointer;line-height:1.45}.choice:hover:not(:disabled){border-color:#7963aa;background:#f6f0ff}.choice:disabled{cursor:default}.choice.good{border-color:#25805b;background:#e0f5e9}.choice.bad{border-color:#b64c50;background:#fde8e7}.feedback{padding:14px 17px;border-radius:14px;background:#eaf3e7;line-height:1.5;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.action{border:0;border-radius:12px;padding:12px 19px;font-weight:800;font-size:16px;background:#6a4c93;color:white;cursor:pointer}button.action.secondary{background:#e9dff6;color:#43345e}button.action:disabled{opacity:.4;cursor:not-allowed}.small{color:#61566c;font-size:14px}.center{text-align:center}.code{font-size:30px;letter-spacing:.25em;color:#604082;font-weight:900}.hidden{display:none}input{font:inherit;padding:12px;border:2px solid #c6b3d9;border-radius:12px;width:100%;max-width:350px}.end{font-size:19px;line-height:1.65}@media(max-width:500px){.story{font-size:16px}.question{font-size:19px}}
</style></head><body><main class="wrap"><header class="hero"><div class="art">🦦🏮✨</div><h1>Ernas Meisterprüfung</h1><p>Das zweite Geheimnis des Martinslichts · Experten-Escape-Room</p></header><section class="card" id="app"></section></main><script>
const questions=[{"title": "Der Soldat und sein Gewissen", "story": "Martin diente als Soldat im römischen Heer. Als er vor einem Stadttor einen frierenden Menschen sah, konnte er nicht einfach weiterreiten. Er bemerkte, dass die Not des Mannes wichtiger war als sein eigener Zeitplan.", "q": "Warum hielt Martin an?", "opts": ["Er wollte seinen Mut vor anderen Soldaten beweisen.", "Er erkannte die Not des Mannes und wollte helfen.", "Er suchte einen Weg, den Dienst zu verlassen."], "correct": 1, "why": "Martin handelte aus Mitgefühl, nicht um bewundert zu werden."}, {"title": "Ein Mantel, zwei Menschen", "story": "Martin hatte keinen zweiten Mantel bei sich. Trotzdem fand er eine Möglichkeit, etwas von seinem Schutz gegen die Kälte abzugeben.", "q": "Welche Überlegung passt am besten zu Martins Entscheidung?", "opts": ["Auch wenn ich nicht alles geben kann, kann ich etwas teilen.", "Ich helfe erst, wenn ich genug für alle habe.", "Ein Soldat darf niemandem etwas schenken."], "correct": 0, "why": "Teilen bedeutet nicht immer, etwas vollständig abzugeben."}, {"title": "Der Preis der Hilfe", "story": "Martin teilte seinen Mantel mit dem Schwert. Danach hatte er selbst nur noch einen Teil davon. Seine Hilfe kostete ihn also etwas.", "q": "Was macht seine Tat besonders?", "opts": ["Er verschenkte etwas, das er gar nicht brauchte.", "Er ließ jemand anderen die Arbeit machen.", "Er nahm selbst einen Nachteil in Kauf, um zu helfen."], "correct": 2, "why": "Er verzichtete auf einen Teil seines eigenen Schutzes."}, {"title": "Die Begegnung im Traum", "story": "Nach der Mantelteilung erzählt die Legende von einem Traum: Martin begegnete Jesus, der den halben Mantel trug. Für Martin bekam die Begegnung mit dem Bettler dadurch eine tiefere Bedeutung.", "q": "Welche Aussage beschreibt diese Stelle der Legende am genauesten?", "opts": ["Martin wurde im Traum zum Kaiser ernannt.", "Die Hilfe für einen bedürftigen Menschen wurde mit der Hilfe für Jesus verbunden.", "Martin erhielt seinen vollständigen Mantel zurück."], "correct": 1, "why": "Der Traum deutet Martins Mitgefühl religiös."}, {"title": "Mehr als ein guter Einfall", "story": "Ein anderes Kind sagt: „Martin war klug, weil er seinen Mantel geteilt hat.“ Erna meint: „Das stimmt, aber etwas Wichtiges fehlt noch.“", "q": "Welche Ergänzung trifft den Kern der Geschichte?", "opts": ["Er dachte an den frierenden Menschen und handelte.", "Er konnte besonders gut mit einem Schwert umgehen.", "Er wusste schon vorher, dass er berühmt werden würde."], "correct": 0, "why": "Die gute Absicht und die Tat gehören zusammen."}, {"title": "Eine schwierige Entscheidung", "story": "Später wandte Martin sich vom Soldatenleben ab und entschied sich für einen religiösen Lebensweg. Damit änderte er nicht nur seinen Beruf, sondern auch seine Lebensziele.", "q": "Welche Aussage ist eine begründete Schlussfolgerung?", "opts": ["Er hatte plötzlich Angst vor Pferden.", "Er wollte nie wieder anderen Menschen begegnen.", "Sein Glaube und seine Überzeugungen beeinflussten seine Entscheidungen."], "correct": 2, "why": "Eine Lebensentscheidung kann aus Überzeugungen entstehen."}, {"title": "Was ist eine Legende?", "story": "Die Martinsgeschichte enthält historische Bezüge und religiöse Überlieferungen. Nicht jedes Detail lässt sich heute wie ein Augenzeugenbericht überprüfen.", "q": "Welche Beschreibung passt zu einer Legende?", "opts": ["Ein Bericht, in dem jede Einzelheit wissenschaftlich bewiesen ist.", "Eine überlieferte Erzählung, die das Leben und die Bedeutung eines Menschen hervorhebt.", "Eine erfundene Rechenaufgabe ohne Bezug zur Vergangenheit."], "correct": 1, "why": "Legenden vermitteln häufig Werte und Glaubensvorstellungen."}, {"title": "Die Gänse und das Versteck", "story": "Eine bekannte Überlieferung erzählt, Martin habe sich vor seiner Ernennung zum Bischof versteckt. Gänse sollen ihn durch ihr lautes Geschnatter verraten haben.", "q": "Warum passt diese Erzählung zum Bild eines bescheidenen Martin?", "opts": ["Er wollte das hohe Amt nicht einfach annehmen.", "Er wollte alle Gänse verkaufen.", "Er plante, ein großes Fest zu feiern."], "correct": 0, "why": "Die Geschichte betont, dass Martin nicht nach Ansehen strebte."}, {"title": "Ein Bischof mit Verantwortung", "story": "Martin wurde Bischof von Tours. Ein Bischof trägt Verantwortung für Menschen und die Kirche. Die Legende zeigt Martin weiterhin als jemanden, der sich um andere kümmert.", "q": "Welche Handlung würde besonders zu diesem Bild passen?", "opts": ["Er achtet nur auf reiche und mächtige Menschen.", "Er lässt schwierige Bitten grundsätzlich unbeantwortet.", "Er hört auch armen Menschen zu und versucht zu helfen."], "correct": 2, "why": "Die Werte der Mantelteilung gelten auch für spätere Aufgaben."}, {"title": "Zwei verschiedene Arten zu helfen", "story": "Erna hat nur einen Apfel. Zwei Kinder haben Hunger. Sie kann den Apfel teilen. Am nächsten Tag entdeckt sie, dass ein Kind regelmäßig ohne Frühstück kommt.", "q": "Welche Lösung denkt über die einmalige Hilfe hinaus?", "opts": ["Sie tut so, als habe sie nichts bemerkt.", "Sie teilt heute und sucht mit einer erwachsenen Person nach dauerhafter Unterstützung.", "Sie erklärt, dass Hunger immer Privatsache sei."], "correct": 1, "why": "Neben sofortiger Hilfe kann es wichtig sein, Ursachen zu beachten."}, {"title": "Eine faire Beurteilung", "story": "Ein Kind sagt: „Martin war nur großzügig, weil er ein teures Pferd hatte.“ Ein anderes sagt: „Entscheidend ist, dass er den frierenden Mann wahrgenommen hat.“", "q": "Welche Aussage lässt sich aus der Mantelgeschichte besser begründen?", "opts": ["Entscheidend ist Martins Bereitschaft, von seinem eigenen Besitz etwas abzugeben.", "Nur reiche Menschen können mitfühlend sein.", "Martin half, weil der Mann ihn darum bezahlte."], "correct": 0, "why": "Nicht das Pferd, sondern die Entscheidung zu helfen steht im Mittelpunkt."}, {"title": "Was bleibt von Martin?", "story": "Viele Menschen ziehen heute mit Laternen durch die Straßen. Sie erinnern dabei an die Geschichte von Martin und an das Teilen. Erna fragt sich, was das mit unserem Alltag zu tun hat.", "q": "Welcher Gedanke führt die Martinslegende am weitesten in die Gegenwart?", "opts": ["Wichtig ist nur, dass die Laternen besonders groß sind.", "Man muss selbst ein Soldat werden, um helfen zu können.", "Man kann auch heute aufmerksam sein, teilen und Menschen nicht alleinlassen."], "correct": 2, "why": "Die Botschaft lässt sich auf heutige Situationen übertragen."}];
let pos=0,solved=false,mistakes=0,masterDone=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u)}
function intro(){$('#app').innerHTML=`<span class="pill">🌟 Zusatzmission für echte Martinsprofis</span><h2>Erna braucht noch einmal deine Hilfe!</h2><div class="story">Du hast die erste Martinslaterne gerettet. Doch hinter einer geheimen Tür liegt das <strong>Buch der guten Taten</strong>. Nur wer die Martinslegende genau versteht, kann es öffnen.<br><br>Hier reicht es nicht, sich einzelne Wörter zu merken: Du musst <strong>nachdenken, vergleichen und begründen</strong>.</div><p><strong>12 Expertenrätsel</strong> und danach eine <strong>Master-Knobelaufgabe</strong> warten auf dich.</p><p class="small">Lies die kurzen Geschichten genau. Du kannst sie dir auch vorlesen lassen. Die richtigen Antworten stehen nicht immer an derselben Stelle.</p><div class="actions"><button class="action" onclick="render()">Meisterprüfung starten →</button></div>`}
function render(){solved=false;const x=questions[pos];$('#app').innerHTML=`<span class="pill">🔐 Expertenrätsel ${pos+1} von ${questions.length}</span><div class="progress"><div class="fill" style="width:${pos/questions.length*100}%"></div></div><h2>${esc(x.title)}</h2><div class="story" id="story">${esc(x.story)}</div><div class="actions"><button class="action secondary" onclick="speak(questions[pos].story+' '+questions[pos].q)">🔊 Text vorlesen</button></div><p class="question">${esc(x.q)}</p><div class="choices">${x.opts.map((o,i)=>`<button class="choice" id="c${i}" onclick="choose(${i})"><strong>${'ABC'[i]}.</strong> ${esc(o)}</button>`).join('')}</div><div id="response" aria-live="polite"></div><div class="actions"><button id="next" class="action" disabled onclick="next()">Weiter →</button></div><p class="small">Tipp: Suche die Antwort, die durch die Erzählung am besten begründet wird.</p>`}
function choose(i){if(solved)return;let x=questions[pos];if(i!==x.correct){mistakes++;$('#c'+i).classList.add('bad');$('#response').innerHTML='<div class="feedback" style="background:#fde8e7">🔎 Noch nicht ganz. Lies den Text erneut und überlege, welche Antwort wirklich passt.</div>';return}solved=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('#c'+i).classList.add('good');$('#response').innerHTML='<div class="feedback">✨ <strong>Richtig!</strong> '+esc(x.why)+'</div>';$('#next').disabled=false}
function next(){pos++;if(pos<questions.length)render();else end()}
function end(){$('#app').innerHTML=`<span class="pill">🏆 Die zwölf Siegel sind geöffnet!</span><div class="center" style="font-size:55px">📖✨🏮</div><h2>Das Buch der guten Taten ist offen!</h2><p class="end">Erna staunt: Du hast nicht nur die Geschichte verstanden. Du kannst auch erklären, <em>warum</em> Martins Entscheidungen wichtig waren.</p><p>Jetzt wartet die <strong>Master-Knobelaufgabe</strong>. Sie ist besonders schwierig!</p><div class="actions"><button class="action" onclick="master()">Master-Knobelaufgabe öffnen →</button></div>`}
function master(){$('#app').innerHTML=`<span class="pill">👑 Master-Knobelaufgabe</span><h2>Die vier Stimmen der Martinslegende</h2><div class="story">Vier Kinder haben über Martin geschrieben. <strong>Nur eine Aussage</strong> passt zu allen wichtigen Stationen seiner Legende: zur Mantelteilung, zum Traum, zu seinem späteren Lebensweg und zu seiner Aufgabe als Bischof.<br><br>Finde die Aussage. Aber Achtung: Drei Antworten klingen zunächst überzeugend!</div><p class="question">Welche Aussage verbindet die ganze Martinslegende am besten?</p><div class="choices" id="mchoices"><button class="choice" onclick="masterChoose(0)">A. Martin half nur dann, wenn er dafür ein Lob oder ein wichtiges Amt bekam.</button><button class="choice" onclick="masterChoose(1)">B. Martin wollte zeigen, dass Menschen mit wenig Besitz keine Hilfe verdienen.</button><button class="choice" onclick="masterChoose(2)">C. Martin ließ sich von seinem Glauben leiten und übernahm Verantwortung für andere, auch wenn das schwierig war.</button><button class="choice" onclick="masterChoose(3)">D. Martin konnte anderen nur helfen, solange er Soldat und Besitzer eines Pferdes war.</button></div><div id="mresponse" aria-live="polite"></div><div class="actions"><button class="action secondary" onclick="speak('Vier Kinder haben über Martin geschrieben. Welche Aussage verbindet die ganze Martinslegende am besten?')">🔊 Aufgabe vorlesen</button></div>`}
function masterChoose(i){if(masterDone)return;if(i!==2){$('#mresponse').innerHTML='<div class="feedback" style="background:#fde8e7">Fast! Prüfe, ob die Aussage wirklich zu <strong>allen vier Stationen</strong> passt.</div>';return}masterDone=true;$('#app').innerHTML=`<div class="center" style="font-size:64px">👑🏮🎉</div><h2 class="center">Du bist Martinslegenden-Meisterin oder -Meister!</h2><p class="end">Du hast bewiesen, dass du nicht nur Fakten kennst, sondern auch Zusammenhänge verstehst. Erna überreicht dir den goldenen Schlüssel!</p><div class="center"><p class="code">M I T G E F Ü H L</p><p>Das wichtigste Geheimnis des Martinslichts.</p></div><div class="actions"><button class="action" onclick="restart()">Noch einmal spielen ↻</button></div>`}
function restart(){pos=0;solved=false;mistakes=0;masterDone=false;intro()}intro();
</script></body></html>
